<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>نظام إدارة وتوليد كلمات المرور</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>مدير كلمات المرور الآمن</h1>

    <!-- قسم توليد كلمة المرور -->
    <section class="card">
      <h2>توليد كلمة مرور قوية</h2>
      <div class="result-container">
        <input type="text" id="generated-password" readonly placeholder="انقر على توليد...">
        <button id="copy-btn" title="نسخ">نسخ</button>
      </div>

      <div class="strength-meter">
        <div id="strength-bar"></div>
      </div>

      <div class="options">
        <div class="option">
          <label for="length">طول كلمة المرور:</label>
          <input type="number" id="length" min="6" max="32" value="16">
        </div>
        <div class="option">
          <label><input type="checkbox" id="uppercase" checked> حروف كبيرة (A-Z)</label>
        </div>
        <div class="option">
          <label><input type="checkbox" id="lowercase" checked> حروف صغيرة (a-z)</label>
        </div>
        <div class="option">
          <label><input type="checkbox" id="numbers" checked> أرقام (0-9)</label>
        </div>
        <div class="option">
          <label><input type="checkbox" id="symbols" checked> رموز خاصة (!@#$%^&*)</label>
        </div>
      </div>

      <button id="generate-btn" class="btn primary">توليد كلمة مرور</button>
    </section>

    <!-- قسم حفظ وتخزين الحسابات -->
    <section class="card">
      <h2>حفظ حساب جديد</h2>
      <form id="save-form">
        <input type="text" id="site-name" placeholder="اسم الموقع (مثال: Google)" required>
        <input type="text" id="username" placeholder="اسم المستخدم / البريد" required>
        <input type="text" id="password-input" placeholder="كلمة المرور" required>
        <button type="submit" class="btn success">حفظ في القائمة</button>
      </form>
    </section>

    <!-- قائمة الحسابات المحفوظة -->
    <section class="card">
      <h2>الحسابات المحفوظة</h2>
      <ul id="password-list"></ul>
    </section>
  </div>

  <script src="script.js"></script>
</body>
</html>
